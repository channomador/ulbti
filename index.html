<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>나의 울릉도 귀농귀촌 MBTI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800;900&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 무광 종이 위 한 장짜리 시험지 — 상단 굵은 선 바, 큰 고딕 헤드라인, 선으로만 구분 (포스터 v5 언어) */
:root{
  --paper:#E9E3D5; --ink:#2B2A27; --terra:#C8643F; --moss:#5D7A57; --soft:#6E6A60; --line:#BDB5A3; --card:#DDD5C3; --sea:#7F99A3; --lav:#8E86A8;
  --head:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all}
.wrap{max-width:520px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:10px;border-bottom:3px solid var(--ink)}
.top .t{font-family:var(--head);font-weight:800;font-size:15px;letter-spacing:-.3px}
.top .t span{white-space:nowrap;color:var(--soft);font-weight:700;font-size:12px;letter-spacing:1.5px;margin-left:6px}
.badge{font-family:var(--head);font-weight:900;font-size:13px;border:2px solid var(--ink);padding:3px 9px 4px;white-space:nowrap}
.badge b{color:var(--terra)}
h1,h2,h3{font-family:var(--head);font-weight:900;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
.lab{font-family:var(--head);font-weight:800;font-size:12px;letter-spacing:1.8px;color:var(--soft)}

/* intro */
.intro .pre{font-family:var(--head);font-weight:700;font-size:19px;margin:28px 0 16px}
.intro h1{font-size:clamp(46px,14vw,68px);line-height:1.02;letter-spacing:-.06em}
.intro h1 em{font-style:normal;color:var(--terra);display:block;font-size:1.75em;line-height:.9;letter-spacing:-.05em;margin-top:4px}
.intro .sub{font-family:var(--head);font-weight:800;font-size:21px;line-height:1.4;letter-spacing:-.5px;margin-top:14px}
.axes{margin:26px 0 0;border-top:1.5px solid var(--ink)}
.axes div{display:grid;grid-template-columns:30px 1fr 18px 1fr 30px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.axes b{font-family:var(--head);font-weight:900;font-size:19px}
.axes b:last-child{text-align:right;color:var(--terra)}
.axes span:nth-child(3){text-align:center;color:var(--soft)}
.axes span:nth-child(4){text-align:right}
.meta{display:flex;gap:18px;margin-top:16px;font-family:var(--head);font-weight:800;font-size:15px}
.meta span{color:var(--soft);font-weight:700}
.go{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:24px;min-height:68px;padding:0 22px;background:var(--ink);color:var(--paper);border:0;font-family:var(--head);font-weight:900;font-size:22px}
.go i{font-style:normal;color:var(--terra);font-size:26px}
.note{font-size:13px;color:var(--soft);margin-top:14px;line-height:1.5}
.ghost{background:none;border:0;padding:6px 0;font-family:var(--head);font-weight:800;font-size:15px;text-decoration:underline;text-underline-offset:4px;color:var(--ink)}

/* question */
.prog{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.prog .n{font-family:var(--head);font-weight:900;font-size:15px}
.prog .n em{font-style:normal;color:var(--terra)}
.bar{height:6px;background:var(--card);margin-top:8px}
.bar i{display:block;height:100%;background:var(--ink);transition:width .25s}
.qnum{font-family:var(--head);font-weight:900;font-size:76px;line-height:1;letter-spacing:-4px;color:var(--terra);margin-top:22px}
.scene{font-family:var(--head);font-weight:800;font-size:14px;color:var(--soft);margin-top:8px}
.q{font-size:clamp(25px,7vw,31px);line-height:1.3;letter-spacing:-.04em;margin-top:8px;min-height:3.9em}
.opts{display:grid;gap:12px;margin-top:18px}
.opt{display:grid;grid-template-columns:40px 1fr;align-items:center;gap:12px;text-align:left;min-height:84px;padding:14px 16px;background:transparent;border:2px solid var(--ink);font-size:18px;line-height:1.4;font-weight:500;transition:background .12s}
.opt b{display:grid;place-items:center;width:40px;height:40px;border:2px solid var(--ink);border-radius:50%;font-family:var(--head);font-weight:900;font-size:18px}
.opt:active,.opt.on{background:var(--ink);color:var(--paper)}
.opt:active b,.opt.on b{border-color:var(--paper);background:var(--terra)}
.qfoot{display:flex;justify-content:space-between;margin-top:18px}

/* result */
.res .lab{margin-top:20px}
.code{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:6px}
.code h1{font-size:clamp(78px,25vw,120px);line-height:.9;letter-spacing:-.05em}
.code h1 span:nth-child(odd){color:var(--terra)}
.ico{width:104px;height:104px;flex:none;margin-bottom:6px}
.name{font-size:clamp(30px,9vw,40px);letter-spacing:-.05em;line-height:1.15;margin-top:16px;padding-top:14px;border-top:3px solid var(--ink)}
.tag{font-family:var(--head);font-weight:800;font-size:19px;color:var(--terra);margin-top:6px;letter-spacing:-.3px}
.desc{font-size:17px;margin:12px 0 0}
.scores{margin-top:20px;border-top:1.5px solid var(--ink)}
.sc{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}
.sc .l{font-family:var(--head);font-weight:800}
.sc .r{font-family:var(--head);font-weight:800;text-align:right}
.sc .w{font-weight:900;color:var(--terra)}
.dots{display:flex;gap:4px;justify-content:center}
.dots i{width:22px;height:12px;background:var(--card)}
.dots i.on{background:var(--terra)} .dots i.off{background:var(--line)}
.blk{margin-top:22px}
.blk h3{font-size:15px;letter-spacing:.3px;padding-bottom:6px;border-bottom:1.5px solid var(--ink)}
.blk p{margin:10px 0 0}
.ask{font-family:var(--head);font-weight:900;font-size:23px;line-height:1.35;letter-spacing:-.04em;margin-top:10px}
.ask::before{content:"Q. ";color:var(--terra)}
.mate{display:flex;align-items:center;gap:14px;margin-top:10px;width:100%;background:none;border:2px solid var(--ink);padding:10px 14px;text-align:left}
.mate svg{width:52px;height:52px;flex:none}
.mate b{font-family:var(--head);font-weight:900;font-size:22px;display:block;line-height:1.1}
.mate span{font-size:14px;color:var(--soft)}
.mission{margin-top:26px;background:var(--ink);color:var(--paper);padding:18px 18px 16px}
.mission h3{font-size:18px;color:var(--paper);border:0;padding:0}
.mission h3 em{font-style:normal;color:var(--terra)}
.mission ol{margin:10px 0 0;padding-left:22px;font-size:16px;line-height:1.55}
.mission li+li{margin-top:4px}
.acts{display:flex;gap:18px;flex-wrap:wrap;margin-top:20px}

/* all types */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin-top:14px;border-top:1.5px solid var(--ink)}
.cell{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;padding:12px 6px 12px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.cell:nth-child(odd){border-right:1px solid var(--line)}
.cell:nth-child(even){padding-left:10px}
.cell svg{width:44px;height:44px}
.cell b{font-family:var(--head);font-weight:900;font-size:17px;display:block;line-height:1.1}
.cell span{font-size:13px;color:var(--soft);line-height:1.3;display:block}
.cell.me{background:var(--card)}
.foot{margin-top:30px;padding-top:12px;border-top:1.5px solid var(--ink);font-size:12px;color:var(--soft);line-height:1.6}
.foot b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

<div class="wrap">
  <div class="top"><div class="t">울릉군 귀농귀촌 아카데미<span>2026 OT</span></div><div class="badge"><b>●</b> MBTI</div></div>
  <main id="app"></main>
  <div class="foot">재미로 보는 테스트예요. 공식 MBTI® 검사와는 관계가 없어요.<br><b>주최·주관</b> 울릉군 농업기술센터 · <b>운영</b> 노마도르</div>
</div>

<script>
// ---------- 문항: a/b 각각 어느 글자로 가는지 ----------
const QS=[
 {ax:0,s:"뱃길 위에서",q:"울릉 가는 배 안, 옆자리 낯선 사람과 나는?",a:["E","내릴 때쯤엔 서로 연락처 교환 완료"],b:["I","멀미약 먹고 조용히 한숨 잔다"]},
 {ax:1,s:"성인봉 정상에서",q:"드디어 성인봉 꼭대기! 제일 먼저 드는 생각은?",a:["N","옛날 우산국 사람들도 이 풍경을 봤겠지?"],b:["S","내려가는 길 미끄럽겠다. 신발 끈부터 다시 묶자"]},
 {ax:2,s:"이웃집 마루에서",q:"어르신이 직접 만든 호박엿을 주시며 \"맛 어때?\" 솔직히… 좀 딱딱하다.",a:["T","\"조금만 더 말랑하면 더 잘 팔리겠어요!\""],b:["F","\"정성이 느껴져요. 너무 맛있어요!\""]},
 {ax:3,s:"문자 한 통",q:"\"내일 기상 악화로 여객선이 결항됩니다.\" 이 문자를 받은 나는?",a:["P","오히려 좋아. 하루 더 논다!"],b:["J","바로 숙소 연장하고 일정부터 다시 짠다"]},
 {ax:0,s:"이사 온 첫날",q:"울릉에 이사 온 첫날 저녁, 나는?",a:["E","떡 들고 이웃집에 인사 돌기"],b:["I","짐 풀고 창밖 바다 보며 라면 한 그릇"]},
 {ax:1,s:"명이 밭 앞에서",q:"명이나물 밭을 보면 떠오르는 건?",a:["S","한 철에 얼마나 나오고, 얼마에 팔릴까?"],b:["N","명이 페스토, 명이 김밥… 신메뉴가 막 떠오른다"]},
 {ax:2,s:"친구의 선언",q:"친구가 \"나 울릉 가서 카페 차릴래!\" 한다면?",a:["F","\"멋지다! 첫 손님은 내가 할게\""],b:["T","\"월세는? 겨울 비수기엔?\" 질문부터 쏟아진다"]},
 {ax:3,s:"출발 전날",q:"울릉 갈 짐은 언제 싸나요?",a:["J","며칠 전부터 목록 써서 차곡차곡"],b:["P","출발 당일 아침, 손에 잡히는 대로"]},
 {ax:0,s:"결항 사흘째",q:"배가 안 떠서 섬에 사흘째 머무는 중. 나는?",a:["I","드디어 밀린 드라마랑 책을 볼 시간"],b:["E","동네 사람들 모아서 윷놀이 한 판"]},
 {ax:1,s:"살 동네 고르기",q:"귀촌할 동네를 고를 때 더 끌리는 곳은?",a:["N","여기 살면 내 인생이 달라질 것 같은 곳"],b:["S","병원·마트·여객선터미널까지 거리 확인이 끝난 곳"]},
 {ax:2,s:"마지막 한 방",q:"귀촌을 결심하게 만드는 마지막 한 방은?",a:["T","소득이랑 지원금 계산이 딱 맞아떨어질 때"],b:["F","그 마을 사람들이 너무 좋을 때"]},
 {ax:3,s:"울릉에서의 하루",q:"울릉에 살게 된다면, 나의 하루는?",a:["P","날씨 보고 정한다. 바다 좋으면 바다로!"],b:["J","새벽에 일어나 정해진 순서대로 착착"]}
];
const AX=[["E","I","어울려 충전","혼자 충전"],["S","N","현실 감각","상상력"],["T","F","계산기","정(情)"],["J","P","출항표대로","결항도 OK"]];

// ---------- 아이콘 (직접 그린 단순 일러스트) ----------
const K="#2B2A27",R="#C8643F",G="#5D7A57",P="#E9E3D5",S="#7F99A3",C="#DDD5C3",L="#8E86A8";
const sv=b=>`<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="58" fill="${C}"/>${b}</svg>`;
const ICON={
 boat:sv(`<path d="M18 74h84l-12 18H30z" fill="${K}"/><path d="M58 74V34" stroke="${K}" stroke-width="4"/><path d="M24 50Q60 40 96 50" stroke="${K}" stroke-width="2" fill="none"/>${[32,46,60,74,88].map((x,i)=>`<circle cx="${x}" cy="${50-(i===2?6:i%4?4:0)}" r="5" fill="${R}"/>`).join("")}<path d="M10 100q10-6 20 0t20 0 20 0 20 0 20 0" stroke="${S}" stroke-width="4" fill="none"/>`),
 shrimp:sv(`<path d="M34 78C30 50 56 30 82 42" stroke="${R}" stroke-width="22" stroke-linecap="round" fill="none"/><path d="M34 80l-14 12 18 2z" fill="${R}"/><path d="M30 76l-16 2 10 12z" fill="${R}"/><circle cx="80" cy="38" r="3.5" fill="${K}"/><path d="M86 36q14-16 24-12M86 42q16-6 22 2" stroke="${K}" stroke-width="2.5" fill="none" stroke-linecap="round"/>${[48,58,68].map(x=>`<path d="M${x} 52l-4 20" stroke="${P}" stroke-width="2.5"/>`).join("")}`),
 yeot:sv(`<ellipse cx="60" cy="68" rx="38" ry="30" fill="${R}"/><path d="M60 38v60M38 44q-8 24 0 48M82 44q8 24 0 48" stroke="#A9512F" stroke-width="3" fill="none"/><path d="M60 40q2-14 12-16" stroke="${G}" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M64 34q14-8 22 2q-12 6-22-2z" fill="${G}"/>`),
 squid:sv(`<path d="M60 14L84 46v28H36V46z" fill="${P}" stroke="${K}" stroke-width="4" stroke-linejoin="round"/><circle cx="50" cy="62" r="4" fill="${K}"/><circle cx="70" cy="62" r="4" fill="${K}"/>${[40,48,56,64,72,80].map((x,i)=>`<path d="M${x} 74q${i%2?6:-6} 14 0 ${i===0||i===5?30:24}" stroke="${K}" stroke-width="4" fill="none" stroke-linecap="round"/>`).join("")}`),
 peak:sv(`<path d="M10 98L52 34l14 18 12-14 34 60z" fill="${G}"/><path d="M52 34l8 12-8 4-6-6z" fill="${P}"/><path d="M52 34V12" stroke="${K}" stroke-width="3.5"/><path d="M52 12h20l-6 6 6 6H52z" fill="${R}"/>`),
 ferry:sv(`<path d="M14 72h92l-14 18H26z" fill="${K}"/><rect x="30" y="54" width="56" height="18" fill="${P}" stroke="${K}" stroke-width="3"/><rect x="42" y="40" width="30" height="14" fill="${P}" stroke="${K}" stroke-width="3"/>${[38,50,62,74].map(x=>`<rect x="${x}" y="60" width="6" height="6" fill="${S}"/>`).join("")}<rect x="56" y="30" width="8" height="10" fill="${R}"/><path d="M10 100q10-6 20 0t20 0 20 0 20 0 20 0" stroke="${S}" stroke-width="4" fill="none"/>`),
 light:sv(`<path d="M48 100l4-58h16l4 58z" fill="${P}" stroke="${K}" stroke-width="3.5" stroke-linejoin="round"/><path d="M50 66h20M49 82h22" stroke="${R}" stroke-width="7"/><rect x="50" y="30" width="20" height="12" fill="${K}"/><path d="M46 30h28l-14-12z" fill="${R}"/><path d="M74 34l28-10M74 38l28 6M46 34L18 24M46 38l-28 6" stroke="${R}" stroke-width="3" stroke-linecap="round"/><path d="M20 100h80" stroke="${K}" stroke-width="4"/>`),
 gull:sv(`<path d="M14 54q22-20 46 4q24-24 46-4q-24-6-46 16q-22-22-46-16z" fill="${P}" stroke="${K}" stroke-width="3.5" stroke-linejoin="round"/><path d="M60 58l-4 8h8z" fill="${R}"/><path d="M18 84q14-6 28 0M74 92q14-6 28 0" stroke="${S}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`),
 juniper:sv(`<path d="M8 104L34 66l18 4 14-20 46 54z" fill="#8F8878"/><path d="M58 56q-4-12 4-22" stroke="${K}" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="52" cy="30" r="12" fill="${G}"/><circle cx="68" cy="26" r="13" fill="${G}"/><circle cx="78" cy="38" r="10" fill="${G}"/><circle cx="60" cy="40" r="9" fill="#4B6646"/>`),
 barnacle:sv(`<path d="M8 104q16-30 52-32t52 32z" fill="#8F8878"/>${[[34,78,14],[58,70,17],[82,80,13],[46,92,10],[74,94,10]].map(([x,y,r])=>`<path d="M${x-r} ${y+r*.6}L${x-r*.45} ${y-r*.7}h${r*.9}L${x+r} ${y+r*.6}z" fill="${P}" stroke="${K}" stroke-width="3" stroke-linejoin="round"/><ellipse cx="${x}" cy="${y-r*.7}" rx="${r*.35}" ry="${r*.18}" fill="${K}"/>`).join("")}`),
 myeongi:sv(`<path d="M60 104q-30-30-10-90q30 40 10 90z" fill="${G}"/><path d="M60 104q32-26 26-78q-36 30-26 78z" fill="#7A9670"/><path d="M60 104q-12-40-8-80M60 104q10-36 24-70" stroke="${P}" stroke-width="2.5" fill="none"/><path d="M60 104h-2" stroke="${K}" stroke-width="6"/>`),
 aster:sv(`<path d="M8 106q20-24 48-20q-2 14-48 20z" fill="#8F8878"/>${Array.from({length:14},(_,i)=>`<ellipse cx="62" cy="34" rx="5" ry="16" fill="${L}" transform="rotate(${i*360/14} 62 52)"/>`).join("")}<circle cx="62" cy="52" r="9" fill="#E0B33A"/><path d="M62 70q-4 20-10 28" stroke="${G}" stroke-width="4" fill="none"/>`),
 island:sv(`<path d="M0 82h120" stroke="${S}" stroke-width="3"/><path d="M4 82q6-34 30-36q10 10 8 36z" fill="${G}"/><path d="M74 82q4-38 22-40q18 6 18 40z" fill="${G}"/><path d="M42 64q18-22 34-2" stroke="${R}" stroke-width="4" fill="none"/><path d="M40 64h38" stroke="${R}" stroke-width="3"/>${[48,56,64,72].map(x=>`<path d="M${x} 64v-${x===48||x===72?6:12}" stroke="${R}" stroke-width="2"/>`).join("")}<path d="M10 96q10-6 20 0t20 0 20 0 20 0 20 0" stroke="${S}" stroke-width="3.5" fill="none"/>`),
 basin:sv(`<path d="M6 96L26 38l18 22 16-30 18 26 16-18 20 58z" fill="${G}"/><path d="M24 96q36-26 72 0z" fill="#C9C29A"/><path d="M52 84h16v10H52z" fill="${P}" stroke="${K}" stroke-width="2.5"/><path d="M48 85l12-10 12 10z" fill="${K}"/>`),
 rock:sv(`<path d="M50 102l4-48q2-26 8-34q8 10 8 34l4 48z" fill="#8F8878" stroke="${K}" stroke-width="3.5" stroke-linejoin="round"/><path d="M58 40q4 20 0 50" stroke="${K}" stroke-width="2" fill="none"/><circle cx="88" cy="32" r="9" fill="${R}"/><path d="M8 102q10-6 20 0t20 0M72 102q10-6 20 0t20 0" stroke="${S}" stroke-width="4" fill="none"/>`),
 lily:sv(`<path d="M60 108V60" stroke="${G}" stroke-width="4"/>${[0,60,120,180,240,300].map(a=>`<path d="M60 50q-6-22 0-34q6 12 0 34z" fill="${R}" transform="rotate(${a} 60 50)"/>`).join("")}<circle cx="60" cy="50" r="6" fill="#A9512F"/>${[0,90,180,270].map(a=>`<circle cx="60" cy="38" r="2" fill="${K}" transform="rotate(${a+45} 60 50)"/>`).join("")}<path d="M60 86q-16-4-22 6M60 96q16-4 22 6" stroke="${G}" stroke-width="5" fill="none" stroke-linecap="round"/>`)
};

// ---------- 16 유형 ----------
const T={
 ESTJ:{ic:"boat",n:"집어등 선장",t:"출항 시간은 제가 지킬게요",d:"새벽 바다에 불 밝히고 제일 먼저 나가는 사람. 해야 할 일, 시간, 사람까지 착착 정리돼야 마음이 편해요. 마을 일을 맡기면 끝까지 확실하게 해내는 든든한 리더예요.",g:"마을 행사 총괄, 작목반·어촌계 살림, 일정 짜기",a:"울릉에서 하루를 산다면, 몇 시에 일어나서 뭘 하실 거예요?"},
 ESTP:{ic:"shrimp",n:"독도새우",t:"생각보다 몸이 먼저 튀어 나가요",d:"일단 해보고 생각하는 현장파. 낯선 곳에서도 금방 적응하고, 어디서 뭐가 열리는지 제일 먼저 알아요. 긴 회의보다 바닷가에서 직접 부딪히는 게 좋아요.",g:"체험 프로그램 진행, 낚시·레저 안내, 급할 때 해결사",a:"지금까지 해본 일 중에 제일 무모했던 건 뭐예요?"},
 ESFJ:{ic:"yeot",n:"호박엿",t:"달고 끈끈하게, 이웃은 제가 챙겨요",d:"새 이웃이 오면 반찬부터 들고 가는 사람. 누가 아픈지, 누구 생일인지 다 기억해요. 모두가 편해야 나도 편한, 마을을 붙여 주는 접착제예요.",g:"마을 잔치 준비, 새 이웃 환영, 단체방 분위기 지킴이",a:"누가 해준 음식 중에 제일 기억에 남는 건 뭐예요?"},
 ESFP:{ic:"squid",n:"울릉 오징어",t:"다리 열 개로 분위기 장악",d:"어디서든 분위기를 띄우는 흥부자. 지금 이 순간을 즐길 줄 알고, 처음 만난 사람과도 금방 웃어요. 축제가 열리면 맨 앞줄에 있을 사람이에요.",g:"축제·공연 무대, 손님맞이, SNS 홍보",a:"요즘 제일 신났던 순간은 언제였어요?"},
 ENTJ:{ic:"peak",n:"성인봉",t:"정상까지, 제가 앞장설게요",d:"울릉에서 가장 높은 봉우리처럼 멀리 보고 크게 계획하는 사람. 목표가 생기면 길을 내고 사람을 모아요. 이 사람에게 귀촌은 '살아보기'가 아니라 '일 벌이기'예요.",g:"마을 사업 기획, 청년 창업, 지원사업 서류 정복",a:"울릉에서 사업을 하나 한다면, 뭘 하실 거예요?"},
 ENTP:{ic:"ferry",n:"여객선",t:"없던 뱃길도 한번 열어 볼까요?",d:"\"왜 안 돼?\"가 입버릇인 아이디어 뱅크. 남들이 불편하다고 할 때 새 방법부터 떠올려요. 섬과 육지, 사람과 사람을 잇는 일에 신이 나요.",g:"새 상품·서비스 기획, 온라인 판로 개척, 문제 해결 회의",a:"울릉에 딱 하나 생기면 좋겠다 싶은 건 뭐예요?"},
 ENFJ:{ic:"light",n:"등대",t:"처음 온 사람은 이쪽으로 오세요",d:"사람들 사이에서 자연스럽게 길잡이가 되는 사람. 처음 온 사람이 어색하지 않게 먼저 말을 걸고, 각자의 장점을 찾아 서로 이어 줘요.",g:"모임 진행, 귀촌 선배와 후배 잇기, 마을 교육",a:"살면서 길잡이가 되어 준 사람이 있나요?"},
 ENFP:{ic:"gull",n:"괭이갈매기",t:"어디든 날아가서 먼저 인사해요",d:"호기심이 많아 섬 구석구석을 날아다니는 사람. 새로운 사람, 새로운 장소만 보면 눈이 반짝여요. 계획은 조금 느슨해도 에너지는 누구보다 커요.",g:"마을 이야기 기록, 여행자와 주민 잇기, 새 모임 만들기",a:"울릉에서 가보고 싶은 곳 세 군데만 꼽는다면요?"},
 ISTJ:{ic:"juniper",n:"절벽 향나무",t:"바람 불어도 그 자리에 꿋꿋하게",d:"바람 센 바위 절벽에서도 오래 버티는 향나무처럼 꾸준한 사람. 말보다 행동이고, 약속은 꼭 지켜요. 시간이 지날수록 믿음이 쌓이는 타입이에요.",g:"농사·어업 기록 관리, 장부 정리, 매일 같은 일 꾸준히",a:"오래 꾸준히 해온 습관이나 일이 있나요?"},
 ISTP:{ic:"barnacle",n:"따개비",t:"혼자서도 바위에 착, 생존 장인",d:"조용하지만 손재주와 요령이 좋은 사람. 고장 난 건 일단 뜯어보고 고쳐요. 거친 파도에도 바위에 딱 붙어 사는 따개비처럼 어디서든 살아남아요.",g:"집 수리, 농기계 손보기, 낚시, 위기 대처",a:"직접 고치거나 만들어 본 것 중에 자랑하고 싶은 게 있나요?"},
 ISFJ:{ic:"myeongi",n:"명이나물",t:"조용히, 든든히, 곁을 지켜요",d:"먹을 것 귀하던 시절 목숨을 이어 줬다고 전해지는 명이처럼, 드러나지 않게 주변을 챙기는 사람. 한 번 맺은 인연을 오래오래 소중히 여겨요.",g:"이웃 돌봄, 장 담그기·저장 음식, 꼼꼼한 살림",a:"누군가를 챙겨 주고 뿌듯했던 기억이 있나요?"},
 ISFP:{ic:"aster",n:"해국",t:"바위틈에서 조용히 피어나요",d:"바닷바람 맞는 바위틈에 피는 해국처럼, 소박하지만 자기만의 색이 있는 사람. 서두르지 않고 지금의 풍경과 마음을 아껴요. 손으로 만드는 일을 좋아해요.",g:"공예·사진·그림, 작은 가게 꾸미기, 꽃밭 가꾸기",a:"요즘 마음에 드는 풍경이나 물건이 있나요?"},
 INTJ:{ic:"island",n:"관음도",t:"조금 떨어져 있어도, 다 계획이 있어요",d:"본섬과 살짝 떨어져 자기만의 세계를 가진 사람. 겉으론 조용해도 머릿속엔 5년 계획이 있어요. 필요할 땐 다리를 놓아 정확하게 이어요.",g:"장기 정착 계획, 시장·데이터 분석, 새 농법 도입",a:"5년 뒤 나는 어디서 뭘 하고 있을 것 같아요?"},
 INTP:{ic:"basin",n:"나리분지",t:"산속에 숨은 생각의 들판",d:"화산이 만든 분지처럼, 조용한 겉모습 안에 넓은 생각의 들판이 있는 사람. '왜?'를 끝까지 파고들고, 궁금한 게 생기면 밤새 찾아봐요.",g:"섬살이 문제 연구, 스마트팜 실험, 정보 정리",a:"요즘 제일 궁금한 게 뭐예요?"},
 INFJ:{ic:"rock",n:"촛대바위",t:"말없이 바다를 지키는 마음",d:"저동항 앞에 묵묵히 선 촛대바위처럼, 조용하지만 속이 깊은 사람. 다른 사람의 마음을 잘 알아채고, 의미 있는 일에 마음을 써요.",g:"고민 상담, 마을 이야기 기록, 공동체의 앞날 그리기",a:"울릉에서 어떤 의미를 찾고 싶으세요?"},
 INFP:{ic:"lily",n:"섬말나리",t:"울릉에서만 피는 나만의 색",d:"섬말나리는 울릉도에서만 자라는 꽃이에요. 남들과 같은 길보다 나다운 삶을 찾는 사람. 마음에 드는 일이라면 오래, 깊게 빠져들어요.",g:"글쓰기·기록, 가게 이야기 만들기, 작은 책방·공방",a:"나다운 하루는 어떤 하루예요?"}
};
// 찰떡 이웃: E/I와 J/P를 뒤집은 유형 (서로 채워 주는 조합)
const flip={E:"I",I:"E",J:"P",P:"J"};
const mateOf=c=>flip[c[0]]+c[1]+c[2]+flip[c[3]];

const app=document.getElementById("app");
let ans=[], cur=0;
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const top0=()=>window.scrollTo({top:0});

function intro(){
  app.className="intro";
  app.innerHTML=`
  <div class="pre">울릉에 살면 나는 어떤 이웃일까?</div>
  <h1>나의 울릉도<br>귀농귀촌 <em>MBTI</em></h1>
  <div class="sub">재미로 보는 울릉 이웃 유형 테스트</div>
  <div class="axes">${AX.map(a=>`<div><b>${a[0]}</b><span>${a[2]}</span><span>↔</span><span>${a[3]}</span><b>${a[1]}</b></div>`).join("")}</div>
  <div class="meta"><div>12문항 <span>· 약 3분</span></div><div>16유형 <span>· 울릉 캐릭터</span></div></div>
  <button class="go" id="start">시작하기 <i>→</i></button>
  <p class="note">정답은 없어요. 너무 고민하지 말고 먼저 끌리는 쪽을 누르세요.</p>
  <button class="ghost" id="all">16유형 먼저 구경하기</button>`;
  document.getElementById("start").onclick=()=>{ans=[];cur=0;question()};
  document.getElementById("all").onclick=()=>{location.hash="types"};
}

function question(){
  const q=QS[cur];
  app.className="qs";
  app.innerHTML=`
  <div class="prog"><div class="n"><em>${String(cur+1).padStart(2,"0")}</em> / 12</div><div class="lab">${AX[q.ax][2]} ↔ ${AX[q.ax][3]}</div></div>
  <div class="bar"><i style="width:${cur/12*100}%"></i></div>
  <div class="qnum">Q${cur+1}</div>
  <div class="scene">${q.s}</div>
  <h2 class="q">${q.q}</h2>
  <div class="opts">
    <button class="opt" data-v="${q.a[0]}"><b>A</b><span>${q.a[1]}</span></button>
    <button class="opt" data-v="${q.b[0]}"><b>B</b><span>${q.b[1]}</span></button>
  </div>
  <div class="qfoot">${cur?'<button class="ghost" id="back">← 이전 문항</button>':'<button class="ghost" id="home">← 처음으로</button>'}<span></span></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    b.classList.add("on"); ans[cur]=b.dataset.v;
    setTimeout(()=>{cur++; if(cur<12){question();top0()} else {location.hash="type-"+calc().code.toLowerCase()}},180);
  });
  const bk=document.getElementById("back"); if(bk) bk.onclick=()=>{cur--;question()};
  const hm=document.getElementById("home"); if(hm) hm.onclick=intro;
}

function calc(){
  const cnt={}; ans.forEach(v=>cnt[v]=(cnt[v]||0)+1);
  const code=AX.map(a=>(cnt[a[0]]||0)>=(cnt[a[1]]||0)?a[0]:a[1]).join("");
  return {code,cnt};
}

function result(code,cnt){
  const t=T[code], m=mateOf(code), mt=T[m];
  app.className="res";
  const scores=cnt?`<div class="scores">${AX.map(a=>{const l=cnt[a[0]]||0,r=cnt[a[1]]||0;const lw=l>r;const dots=Array.from({length:3},(_,i)=>`<i class="${(i<l)===lw?"on":"off"}"></i>`).join("");return `<div class="sc"><div class="l ${l>r?"w":""}">${a[0]} ${a[2]}</div><div class="dots">${dots}</div><div class="r ${r>l?"w":""}">${a[3]} ${a[1]}</div></div>`}).join("")}</div>`:"";
  app.innerHTML=`
  <div class="lab">${cnt?"나의 울릉도 귀농귀촌 MBTI":"울릉도 귀농귀촌 MBTI 유형 보기"}</div>
  <div class="code"><h1>${code.split("").map(c=>`<span>${c}</span>`).join("")}</h1><div class="ico">${ICON[t.ic]}</div></div>
  <h2 class="name">${t.n}</h2>
  <div class="tag">${t.t}</div>
  <p class="desc">${t.d}</p>
  ${scores}
  <div class="blk"><h3>울릉에서 이런 일, 잘해요</h3><p>${t.g}</p></div>
  <div class="blk"><h3>저에게 이렇게 말 걸어 주세요</h3><div class="ask">${t.a}</div></div>
  <div class="blk"><h3>찰떡 이웃</h3><button class="mate" id="mate">${ICON[mt.ic]}<div><b>${m} ${mt.n}</b><span>서로 부족한 걸 채워 주는 조합이에요</span></div></button></div>
  ${cnt?`<div class="mission"><h3><em>●</em> OT 미션</h3><ol><li>이 화면을 옆 사람에게 보여 주세요.</li><li>위의 <b>말 걸기 질문</b>으로 대화를 시작해요.</li><li>오늘 모인 사람 중 <b>${m}</b> 찰떡 이웃을 찾아보세요.</li></ol></div>`:""}
  <div class="acts"><button class="ghost" id="types">16유형 모두 보기</button><button class="ghost" id="again">${cnt?"다시 해보기":"나도 테스트하기"}</button></div>`;
  document.getElementById("mate").onclick=()=>{location.hash="type-"+m.toLowerCase()};
  document.getElementById("types").onclick=()=>{location.hash="types"};
  document.getElementById("again").onclick=()=>{ans=[];cur=0;history.replaceState(null,"",location.pathname+location.search);question();top0()};
}

let mine=null;
function types(){
  app.className="types";
  app.innerHTML=`<div class="lab" style="margin-top:20px">16 TYPES</div><h2 style="font-size:32px;letter-spacing:-.04em;margin-top:4px">울릉 이웃 16유형</h2>
  <div class="grid">${Object.keys(T).map(c=>`<button class="cell ${c===mine?"me":""}" data-c="${c}">${ICON[T[c].ic]}<div><b>${c}</b><span>${T[c].n}${c===mine?" · 나":""}</span></div></button>`).join("")}</div>
  <div class="acts"><button class="ghost" id="back2">${mine?"← 내 결과로":"← 처음으로"}</button></div>`;
  app.querySelectorAll(".cell").forEach(b=>b.onclick=()=>{location.hash="type-"+b.dataset.c.toLowerCase()});
  document.getElementById("back2").onclick=()=>{location.hash=mine?"type-"+mine.toLowerCase():"";if(!mine)route()};
}

function route(){
  const h=location.hash.slice(1);
  if(h==="types"){types();top0();return}
  const m=h.match(/^type-([eisntfjp]{4})$/);
  if(m&&T[m[1].toUpperCase()]){
    const code=m[1].toUpperCase();
    if(ans.length===12&&calc().code===code){mine=code;result(code,calc().cnt)} else result(code,null);
    top0();return;
  }
  intro();
}
window.addEventListener("hashchange",route);
route();
</script>
</body></html>
